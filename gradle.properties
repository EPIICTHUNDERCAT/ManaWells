# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Gradle 9 / FG7 performance flags
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
net.minecraftforge.gradle.merge-source-sets=true


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1.2,26.2)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=64.0.5
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[64,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[64,)
# mapping_channel and mapping_version removed — the mappings{} DSL no longer exists in 26.1.2.
# mojmapped (official) names are the default; no explicit mapping configuration is needed.


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=manawell
# The human-readable display name for the mod.
mod_name=Mana Wells
# The license of the mod.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=26.1.2-0.0.1
# The group ID for the mod. Should match the base package used for the mod sources.
mod_group_id=com.epiicthundercat.manawell
# The authors of the mod.
mod_authors=EPIIC_THUNDERCAT, calheb, Legacy: Dark Lizzy
# The description of the mod.
mod_description=The Mod Adds 1 block, at the bottom of the world that generates 'mana', or XP, this block can be activated(stepped on) to claim the XP found, hurry and claim your XP before it claims yours!(note, the xp is returned.)
