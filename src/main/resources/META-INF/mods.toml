modLoader="javafml" #mandatory
# Expanded from gradle.properties loader_version_range at build time.
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
logoFile="manawell.png" #optional
credits="Thanks to Dark Lizzy for allowing me to take ownership of the idea, now improved and built upon the original idea." #optional
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    # Expanded from gradle.properties forge_version_range at build time.
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    # Expanded from gradle.properties minecraft_version_range at build time.
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
